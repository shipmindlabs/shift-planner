[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shift-planner"
version = "0.1.0"
description = "Shift planning for field couriers: activity windows, assignment, and cooldown locks after a refusal."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Shipmind Labs", email = "hello@shipmindlabs.com" }]
keywords = ["scheduling", "shifts", "planning", "couriers", "logistics"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Scheduling",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/shipmindlabs/shift-planner"
Source = "https://github.com/shipmindlabs/shift-planner"
Issues = "https://github.com/shipmindlabs/shift-planner/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/shift_planner"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
